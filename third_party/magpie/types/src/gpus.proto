syntax = "proto2";

package magpie.gpus;

enum OpenGLVariant {
  OpenGL = 0;
  OpenGLES = 1;
  Invalid = 255;
}

message ApiVersion {
  required uint32 major = 1;
  required uint32 minor = 2;
  optional uint32 patch = 3;
}

message Process {
  enum Kind {
    Graphical = 0;
    Compute = 1;
    GraphicalCompute = 2;
  }

  optional Kind kind = 1;
  optional uint64 memory_usage_bytes = 2;
  optional float gpu_usage_percent = 3;
  optional float encode_usage_percent = 4;
  optional float decode_usage_percent = 5;
}

message Gpu {
  required string id = 1;
  optional string device_name = 2;
  required uint32 vendor_id = 3;
  required uint32 device_id = 4;
  optional float temperature_c = 5;
  optional float fan_speed_percent = 6;
  optional float utilization_percent = 7;
  optional float power_draw_watts = 8;
  optional float max_power_draw_watts = 9;
  optional uint32 clock_speed_mhz = 10;
  optional uint32 max_clock_speed_mhz = 11;
  optional uint32 memory_speed_mhz = 12;
  optional uint32 max_memory_speed_mhz = 13;
  optional uint64 total_memory = 14;
  optional uint64 used_memory = 15;
  optional uint64 total_shared_memory = 16;
  optional uint64 used_shared_memory = 17;
  optional float encoder_percent = 18;
  optional float decoder_percent = 19;
  optional uint32 pcie_gen = 20;
  optional uint32 pcie_lanes = 21;
  optional uint32 max_pcie_gen = 22;
  optional uint32 max_pcie_lanes = 23;
  optional OpenGLVariant opengl_variant = 24;
  optional ApiVersion opengl_version = 25;
  optional ApiVersion vulkan_version = 26;
  optional ApiVersion metal_version = 27;
  optional ApiVersion directx_version = 28;
  optional ApiVersion opencl_version = 29;
  optional ApiVersion cuda_version = 30;
  required bool encode_decode_shared = 32;
  map<uint32, Process> processes = 33;
}

message GpusRequest {}

message GpusResponse {
  message GpuMap {
    map<string, Gpu> gpus = 1;
  }

  oneof response {
    GpuMap gpus = 1;
    GpusResponseError error = 2;
  }
}

message GpusResponseError {}
