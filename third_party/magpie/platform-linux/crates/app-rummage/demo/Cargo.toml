[package]
name = "app-rummage-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
app-rummage = { path = ".." }
egui_extras = { version = "0.28", default-features = false, features = ["file", "image", "svg"] }
eframe = { version = "0.28", default-features = false, features = ["wayland", "glow", "default_fonts"] }
dconf = { version = "0.1" }

[profile.release]
opt-level = 3
lto = true
strip = "debuginfo"
codegen-units = 1
